name: Verify and deploy example

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-and-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            example/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir example install --frozen-lockfile
      - name: Verify library, example and npm tarball
        run: pnpm verify
        env:
          VITE_BASE: /color-picker-lib/
      - name: Record deployed version and commit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node --input-type=module -e "import fs from 'node:fs'; const pkg=JSON.parse(fs.readFileSync('package.json')); fs.writeFileSync('example/dist/version.json', JSON.stringify({version:pkg.version,commit:process.env.GITHUB_SHA}));"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: example/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
